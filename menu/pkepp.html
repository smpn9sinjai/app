<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layanan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f4f6fb;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-3px);
}

.title{
    font-size:17px;
    font-weight:500;
}

.title i{
    color:#f4b400;
    margin-right:10px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<div class="container">

<h2>UPLOAD Dokumen Layanan PEKPP</h2>

<div id="daftar"></div>

</div>

<script>

const layanan=[
{
nama:"1. Kebijakan Pelayanan",
link:"https://drive.google.com/drive/folders/1fR26ykpH9AfswLfdwmpWxivuv07dqJcP?usp=drive_link"
},
{
nama:"2. Profesionalisme SDM",
link:"https://drive.google.com/drive/folders/1cWvMdIAVHJ2D4el7yK7V5DeKXxpQBUPl?usp=drive_link"
},
{
nama:"3. Sarana dan Prasarana",
link:"https://drive.google.com/drive/folders/1hciizR3kwunSK1lenODJOUPT7yc8yJ9p?usp=drive_link"
},
{
nama:"4. Sistem Informasi Pelayanan",
link:"https://drive.google.com/drive/folders/1upPDwT2ovUudnLMPZrEfGMLjGPoFwcp1?usp=drive_link"
},
{
nama:"5. Konsultasi dan Pengaduan",
link:"https://drive.google.com/drive/folders/1uxLrNPTm78OhtsdsNiEA190qmJIqqmcY?usp=drive_link"
},
{
nama:"6. Inovasi",
link:"https://drive.google.com/drive/folders/1-yR7Ju7f8AbMzRda5D6Uox49-MY372se?usp=drive_link"
}
];

const daftar=document.getElementById("daftar");

layanan.forEach(item=>{

daftar.innerHTML+=`
<div class="card">
<div class="title">
<i class="fa-solid fa-folder"></i>
${item.nama}
</div>

<button onclick="window.open('${item.link}','_blank')">
<i class="fa-solid fa-folder-open"></i>
Buka
</button>

</div>
`;

});

</script>

</body>
</html>
